[project]
name = "custom-vehicle-sound-processor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.2.4",
    "openai-whisper>=20240930",
    "panns-inference>=0.1.1",
    "pydub>=0.25.1",
    "streamlit>=1.44.1",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "watchdog>=6.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Ruff's default rule set. Pinned here so the check script stays stable.
select = ["E4", "E7", "E9", "F"]
